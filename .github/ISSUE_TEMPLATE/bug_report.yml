name: 🐛 Bug report
description: Something isn't working as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 1.2.0
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: OS, runtime and version (Node, Bun, browser...)
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed any secrets, tokens or personal data from this report.
          required: true
